# Shared diagnostic UF2 settings.
# Layer this after config/app/prj_uf2.conf and before a transport overlay.

# Keep diagnostic builds awake so serial output is reliable.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# Common serial/log plumbing. The transport overlay selects USB CDC or hardware UART.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y

# Diagnostic builds favor readable bring-up logs over minimum size/power.
CONFIG_TINYENV_DIAGNOSTIC_MODE=y
CONFIG_TINYENV_DISABLE_BOARD_UI=y
CONFIG_TINYENV_ENABLE_STATUS_LED_ACTIVITY=n
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MPU_LOG_LEVEL_OFF=y

# Enable the app shell in diagnostic transports so decom/wipe/diag commands are available.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="tinyenv:~$ "
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_HELP=y
CONFIG_CHIP_LIB_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
