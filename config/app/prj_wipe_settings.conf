# One-off recovery profile: erase settings storage at boot, then park.
CONFIG_TINYENV_WIPE_SETTINGS_ON_BOOT=y

# Keep UART output available so the wipe result is visible.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_PRINTK=y
CONFIG_TINYENV_DISABLE_BOARD_UI=y
CONFIG_TINYENV_ENABLE_STATUS_LED_ACTIVITY=n
CONFIG_CHIP_APP_LOG_LEVEL=2
CONFIG_MATTER_LOG_LEVEL_ERR=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_CHIP_LIB_SHELL=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
